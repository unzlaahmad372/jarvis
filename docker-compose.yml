services:

  # ── Ollama (local LLM server) ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── JARVIS backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - jarvis_data:/app/data
    environment:
      JARVIS_OLLAMA_URL: http://ollama:11434
      JARVIS_LLM_MODEL: ${JARVIS_LLM_MODEL:-llama3.2}
      JARVIS_EMBEDDING_MODEL: ${JARVIS_EMBEDDING_MODEL:-nomic-embed-text}
      JARVIS_VISION_MODEL: ${JARVIS_VISION_MODEL:-llava}
      JARVIS_AUTH_SECRET_KEY: ${JARVIS_AUTH_SECRET_KEY:-change-me-in-production}
      JARVIS_RUNTIME_MODE: container
      JARVIS_HOST: 0.0.0.0
      JARVIS_ENABLE_REMOTE_ACCESS: "true"
      JARVIS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      JARVIS_LOG_LEVEL: ${JARVIS_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── JARVIS frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jarvis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  ollama_data:
  jarvis_data:
